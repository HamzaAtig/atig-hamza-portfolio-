<div class="seq-block">
<p class="seq-intro">Two reference diagrams to illustrate the approach (generic patterns, not a client&#x27;s architecture).</p>
<figure class="seq-fig">
<p class="seq-title">SSO login: OpenID Connect with PKCE, directory federation and MFA</p>
<div class="seq-wrap"><svg class="seq" viewBox="0 0 880 680" role="img" aria-labelledby="sso-en-t"><title id="sso-en-t">SSO login: OpenID Connect with PKCE, directory federation and MFA</title><defs><marker id="sso-en-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="seq-head" d="M0,0 L10,5 L0,10 z"/></marker></defs><line class="seq-life" x1="75" y1="56" x2="75" y2="662"/><rect class="seq-actor" x="9" y="8" width="132" height="46" rx="7"/><text class="seq-actor-t" x="75" y="28" text-anchor="middle">User</text><text class="seq-actor-t" x="75" y="43" text-anchor="middle">(browser)</text><line class="seq-life" x1="258" y1="56" x2="258" y2="662"/><rect class="seq-actor" x="192" y="8" width="132" height="46" rx="7"/><text class="seq-actor-t" x="258" y="36" text-anchor="middle">Web application</text><line class="seq-life" x1="440" y1="56" x2="440" y2="662"/><rect class="seq-actor" x="374" y="8" width="132" height="46" rx="7"/><text class="seq-actor-t" x="440" y="28" text-anchor="middle">Keycloak</text><text class="seq-actor-t" x="440" y="43" text-anchor="middle">(SSO)</text><line class="seq-life" x1="622" y1="56" x2="622" y2="662"/><rect class="seq-actor" x="556" y="8" width="132" height="46" rx="7"/><text class="seq-actor-t" x="622" y="28" text-anchor="middle">Directory</text><text class="seq-actor-t" x="622" y="43" text-anchor="middle">(AD / LDAP)</text><line class="seq-life" x1="805" y1="56" x2="805" y2="662"/><rect class="seq-actor" x="739" y="8" width="132" height="46" rx="7"/><text class="seq-actor-t" x="805" y="36" text-anchor="middle">Business API</text><line class="seq-msg" x1="75" y1="92" x2="258" y2="92" marker-end="url(#sso-en-arr)"/><circle class="seq-num" cx="85" cy="79" r="8"/><text class="seq-num-t" x="85" y="83" text-anchor="middle">1</text><text class="seq-label halo" x="97" y="86">Opens the application</text><line class="seq-msg reply" x1="258" y1="136" x2="75" y2="136" marker-end="url(#sso-en-arr)"/><circle class="seq-num" cx="85" cy="123" r="8"/><text class="seq-num-t" x="85" y="127" text-anchor="middle">2</text><text class="seq-label halo" x="97" y="130">Redirect to Keycloak (code + PKCE)</text><line class="seq-msg" x1="75" y1="180" x2="440" y2="180" marker-end="url(#sso-en-arr)"/><circle class="seq-num" cx="85" cy="167" r="8"/><text class="seq-num-t" x="85" y="171" text-anchor="middle">3</text><text class="seq-label halo" x="97" y="174">Enters username and password</text><line class="seq-msg" x1="440" y1="224" x2="622" y2="224" marker-end="url(#sso-en-arr)"/><circle class="seq-num" cx="450" cy="211" r="8"/><text class="seq-num-t" x="450" y="215" text-anchor="middle">4</text><text class="seq-label halo" x="462" y="218">Checks the identity (federation)</text><line class="seq-msg reply" x1="622" y1="268" x2="440" y2="268" marker-end="url(#sso-en-arr)"/><circle class="seq-num" cx="450" cy="255" r="8"/><text class="seq-num-t" x="450" y="259" text-anchor="middle">5</text><text class="seq-label halo" x="462" y="262">Valid identity + groups</text><circle class="seq-num" cx="452" cy="299" r="8"/><text class="seq-num-t" x="452" y="303" text-anchor="middle">6</text><rect class="seq-note" x="462" y="290" width="155" height="22" rx="5"/><text class="seq-label" x="470" y="305">Second factor (MFA)</text><line class="seq-msg reply" x1="440" y1="356" x2="75" y2="356" marker-end="url(#sso-en-arr)"/><circle class="seq-num" cx="85" cy="343" r="8"/><text class="seq-num-t" x="85" y="347" text-anchor="middle">7</text><text class="seq-label halo" x="97" y="350">Redirect with an authorization code</text><line class="seq-msg" x1="75" y1="400" x2="258" y2="400" marker-end="url(#sso-en-arr)"/><circle class="seq-num" cx="85" cy="387" r="8"/><text class="seq-num-t" x="85" y="391" text-anchor="middle">8</text><text class="seq-label halo" x="97" y="394">Back to the application with the code</text><line class="seq-msg" x1="258" y1="444" x2="440" y2="444" marker-end="url(#sso-en-arr)"/><circle class="seq-num" cx="268" cy="431" r="8"/><text class="seq-num-t" x="268" y="435" text-anchor="middle">9</text><text class="seq-label halo" x="280" y="438">Exchanges the code (+ PKCE) for tokens</text><line class="seq-msg reply" x1="440" y1="488" x2="258" y2="488" marker-end="url(#sso-en-arr)"/><circle class="seq-num" cx="268" cy="475" r="8"/><text class="seq-num-t" x="268" y="479" text-anchor="middle">10</text><text class="seq-label halo" x="280" y="482">ID token + short-lived access token (JWT, mapped roles)</text><line class="seq-msg" x1="258" y1="532" x2="805" y2="532" marker-end="url(#sso-en-arr)"/><circle class="seq-num" cx="268" cy="519" r="8"/><text class="seq-num-t" x="268" y="523" text-anchor="middle">11</text><text class="seq-label halo" x="280" y="526">Call with the access token</text><circle class="seq-num" cx="793" cy="563" r="8"/><text class="seq-num-t" x="793" y="567" text-anchor="middle">12</text><rect class="seq-note" x="468" y="554" width="315" height="22" rx="5"/><text class="seq-label" x="476" y="569">Checks signature, expiry, audience, roles</text><line class="seq-msg reply" x1="805" y1="620" x2="258" y2="620" marker-end="url(#sso-en-arr)"/><circle class="seq-num" cx="268" cy="607" r="8"/><text class="seq-num-t" x="268" y="611" text-anchor="middle">13</text><text class="seq-label halo" x="280" y="614">Authorized data</text></svg></div>
<figcaption>Opening a second application asks for nothing: the Keycloak session is enough (SSO). Logout is centralized.</figcaption>
</figure>
<figure class="seq-fig">
<p class="seq-title">B2B exchange between components, zero trust</p>
<div class="seq-wrap"><svg class="seq" viewBox="0 0 880 592" role="img" aria-labelledby="zt-en-t"><title id="zt-en-t">B2B exchange between components, zero trust</title><defs><marker id="zt-en-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="seq-head" d="M0,0 L10,5 L0,10 z"/></marker></defs><line class="seq-life" x1="75" y1="56" x2="75" y2="574"/><rect class="seq-actor" x="9" y="8" width="132" height="46" rx="7"/><text class="seq-actor-t" x="75" y="28" text-anchor="middle">Partner</text><text class="seq-actor-t" x="75" y="43" text-anchor="middle">system</text><line class="seq-life" x1="221" y1="56" x2="221" y2="574"/><rect class="seq-actor" x="155" y="8" width="132" height="46" rx="7"/><text class="seq-actor-t" x="221" y="36" text-anchor="middle">Keycloak</text><line class="seq-life" x1="367" y1="56" x2="367" y2="574"/><rect class="seq-actor" x="301" y="8" width="132" height="46" rx="7"/><text class="seq-actor-t" x="367" y="36" text-anchor="middle">API gateway</text><line class="seq-life" x1="513" y1="56" x2="513" y2="574"/><rect class="seq-actor" x="447" y="8" width="132" height="46" rx="7"/><text class="seq-actor-t" x="513" y="28" text-anchor="middle">Business</text><text class="seq-actor-t" x="513" y="43" text-anchor="middle">service</text><line class="seq-life" x1="659" y1="56" x2="659" y2="574"/><rect class="seq-actor" x="593" y="8" width="132" height="46" rx="7"/><text class="seq-actor-t" x="659" y="36" text-anchor="middle">Database</text><line class="seq-life" x1="805" y1="56" x2="805" y2="574"/><rect class="seq-actor" x="739" y="8" width="132" height="46" rx="7"/><text class="seq-actor-t" x="805" y="36" text-anchor="middle">Audit log</text><line class="seq-msg" x1="75" y1="92" x2="221" y2="92" marker-end="url(#zt-en-arr)"/><circle class="seq-num" cx="85" cy="79" r="8"/><text class="seq-num-t" x="85" y="83" text-anchor="middle">1</text><text class="seq-label halo" x="97" y="86">Requests a token: client credentials + certificate (mTLS)</text><circle class="seq-num" cx="233" cy="123" r="8"/><text class="seq-num-t" x="233" y="127" text-anchor="middle">2</text><rect class="seq-note" x="243" y="114" width="359" height="22" rx="5"/><text class="seq-label" x="251" y="129">Checks the certificate, applies least privilege</text><line class="seq-msg reply" x1="221" y1="180" x2="75" y2="180" marker-end="url(#zt-en-arr)"/><circle class="seq-num" cx="85" cy="167" r="8"/><text class="seq-num-t" x="85" y="171" text-anchor="middle">3</text><text class="seq-label halo" x="97" y="174">Short-lived token (5 min), bound to the certificate, narrow scope</text><line class="seq-msg" x1="75" y1="224" x2="367" y2="224" marker-end="url(#zt-en-arr)"/><circle class="seq-num" cx="85" cy="211" r="8"/><text class="seq-num-t" x="85" y="215" text-anchor="middle">4</text><text class="seq-label halo" x="97" y="218">Request + token, over an mTLS channel</text><circle class="seq-num" cx="379" cy="255" r="8"/><text class="seq-num-t" x="379" y="259" text-anchor="middle">5</text><rect class="seq-note" x="389" y="246" width="396" height="22" rx="5"/><text class="seq-label" x="397" y="261">Checks: certificate = token, signature, scope, quota</text><line class="seq-msg" x1="367" y1="312" x2="513" y2="312" marker-end="url(#zt-en-arr)"/><circle class="seq-num" cx="377" cy="299" r="8"/><text class="seq-num-t" x="377" y="303" text-anchor="middle">6</text><text class="seq-label halo" x="389" y="306">Forwards over a new mTLS channel</text><circle class="seq-num" cx="501" cy="343" r="8"/><text class="seq-num-t" x="501" y="347" text-anchor="middle">7</text><rect class="seq-note" x="139" y="334" width="352" height="22" rx="5"/><text class="seq-label" x="147" y="349">Re-checks the token, applies the business rule</text><line class="seq-msg" x1="513" y1="400" x2="659" y2="400" marker-end="url(#zt-en-arr)"/><circle class="seq-num" cx="523" cy="387" r="8"/><text class="seq-num-t" x="523" y="391" text-anchor="middle">8</text><text class="seq-label halo" x="535" y="394">Dedicated service account, minimal rights</text><line class="seq-msg reply" x1="659" y1="444" x2="513" y2="444" marker-end="url(#zt-en-arr)"/><circle class="seq-num" cx="523" cy="431" r="8"/><text class="seq-num-t" x="523" y="435" text-anchor="middle">9</text><text class="seq-label halo" x="535" y="438">Result</text><line class="seq-msg reply" x1="513" y1="488" x2="75" y2="488" marker-end="url(#zt-en-arr)"/><circle class="seq-num" cx="85" cy="475" r="8"/><text class="seq-num-t" x="85" y="479" text-anchor="middle">10</text><text class="seq-label halo" x="97" y="482">Response (through the gateway)</text><line class="seq-msg" x1="367" y1="532" x2="805" y2="532" marker-end="url(#zt-en-arr)"/><circle class="seq-num" cx="377" cy="519" r="8"/><text class="seq-num-t" x="377" y="523" text-anchor="middle">11</text><text class="seq-label halo" x="389" y="526">Log: who, what, when, decision</text></svg></div>
<figcaption>No implicit trust: every hop is authenticated (mTLS), every call is authorized (short-lived token, audience, scope), everything is logged.</figcaption>
</figure>
</div>
