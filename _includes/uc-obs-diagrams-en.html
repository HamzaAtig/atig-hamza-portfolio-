ry X&#x27;s dashboard</text><line class="seq-msg" x1="805" y1="400" x2="367" y2="400" marker-end="url(#detect-en-arr)"/><circle class="seq-num" cx="377" cy="387" r="8"/><text class="seq-num-t" x="377" y="391" text-anchor="middle">8</text><text class="seq-label halo" x="389" y="394">Search by correlation ID</text><line class="seq-msg reply" x1="367" y1="444" x2="805" y2="444" marker-end="url(#detect-en-arr)"/><circle class="seq-num" cx="377" cy="431" r="8"/><text class="seq-num-t" x="377" y="435" text-anchor="middle">9</text><text class="seq-label halo" x="389" y="438">Full path of the failing request</text><line class="seq-msg" x1="659" y1="488" x2="75" y2="488" marker-end="url(#detect-en-arr)"/><circle class="seq-num" cx="85" cy="475" r="8"/><text class="seq-num-t" x="85" y="479" text-anchor="middle">10</text><text class="seq-label halo" x="97" y="482">Fix or failover</text><line class="seq-msg reply" x1="513" y1="532" x2="659" y2="532" marker-end="url(#detect-en-arr)"/><circle class="seq-num" cx="523" cy="519" r="8"/><text class="seq-num-t" x="523" y="523" text-anchor="middle">11</text><text class="seq-label halo" x="535" y="526">Back within the service objective</text></svg></div>
